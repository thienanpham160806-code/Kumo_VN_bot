name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = ban Python trong Dockerfile (Render); 3.12 = may phat trien
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # Chi requirements.txt - KHONG cai vnstock (phu thuoc tuy chon, PyPI dang
      # cach ly): CI cung la phep thu "may moi cai duoc va chay duoc khong".
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check src tests scripts

      - name: Pytest
        env:
          PYTHONPATH: src
        run: pytest -q
