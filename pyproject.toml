[project]
name = "bot-phan-tich"
version = "0.1.0"
description = "Telegram bot phan tich ky thuat chung khoan Viet Nam - hop luu MACD, RSI, Ichimoku"
requires-python = ">=3.10"
# Giu dong bo voi requirements.txt (Docker/Render cai tu file do).
dependencies = [
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "tenacity>=8.2",
    "dnse-sdk-openapi>=2.3",
    "urllib3>=2.0",
    "certifi",
    "websockets>=12.0",
    "msgpack>=1.0",
    "httpx>=0.27",
    "requests>=2.31",
    "psutil>=5.9",
    "scipy>=1.11",
    "pdfplumber>=0.11",
    "aiogram>=3.7",
    "apscheduler>=3.10",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# vnstock bi PyPI cach ly tu 25/09/2026 - tuy chon, bot van chay khi thieu.
vnstock = ["vnstock>=4.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
